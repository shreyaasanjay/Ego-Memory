[project]
name = "egomemory"
version = "0.1.0"
description = "Multimodal episodic-memory retrieval for Ego-Exo4D recordings"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faiss-cpu>=1.8.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
media = ["opencv-python>=4.10", "librosa>=0.10", "soundfile>=0.12"]
models = ["torch>=2.3", "torchvision>=0.18", "transformers>=4.45", "sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
